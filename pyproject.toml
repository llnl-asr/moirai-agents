[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moirai-agents"
version = "0.1.0"
description = "Capability-centric agents for moirai: annotate, run, watch and explore data provenance"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# The kernel, MCP server and web UI are stdlib-only so they run from any python3 on a cluster. moirai and
# dftracer-utils are found at run time (MOIRAI_AGENTS_MOIRAI_PYTHON), never imported into this process.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
# Sessions, site detection, skills, agents and the permission policy. scripts/setup_env.sh installs it editable from a checkout (no deps from its
# git pins: they build C++); the core still imports with stdlib only, so capabilities fall back to their own tools without it.
dftracer = ["dftracer-agents", "fastmcp", "dftracer-utils"]

[project.scripts]
moirai-mcp-server = "moirai_agents.mcp_server:main"
moirai-webui      = "moirai_agents.webui.server:main"
moirai-workspace  = "moirai_agents.workspace:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"moirai_agents" = [".agents/capabilities/**/*", ".agents/hooks/*", "webui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
